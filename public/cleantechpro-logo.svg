<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" width="320" height="76" fill="none">
  <defs>
    <linearGradient id="ctGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ctGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ctGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Isometric Dynamic Ribbon Symbol (Left Side) -->
    <g transform="translate(6, 6) scale(0.85)">
      <!-- Top Fold -->
      <polygon points="26,6 54,6 68,22 40,22" fill="url(#ctGrad2)"/>
      <!-- Right Fold -->
      <polygon points="54,6 68,22 56,52 42,36" fill="url(#ctGrad1)"/>
      <!-- Left Fold -->
      <polygon points="26,6 40,22 28,52 14,36" fill="url(#ctGrad1)"/>
      <!-- Center Intersecting Fold -->
      <polygon points="40,22 62,22 46,52 24,52" fill="url(#ctGrad3)" opacity="0.95"/>
      <!-- Bottom Return Tail -->
      <polygon points="46,52 60,52 44,70 30,70" fill="url(#ctGrad1)"/>
    </g>

    <!-- Typography (Right of Symbol) -->
    <!-- CLEAN TECH -->
    <text x="74" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" letter-spacing="1.2" fill="#FFFFFF">
      CLEAN TECH
    </text>
    
    <!-- PRO Badge / Text -->
    <rect x="230" y="21" width="54" height="22" rx="5" fill="#38BDF8"/>
    <text x="257" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" fill="#00353F">
      PRO
    </text>

    <!-- Tagline Subtitle -->
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="7.6" font-weight="700" letter-spacing="1.6" fill="#BAE6FD">
      LOCAÇÃO E ASSISTÊNCIA TÉCNICA
    </text>
  </g>
</svg>